<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musify Web Player</title>
  <meta name="theme-color" content="#121212">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 15px; background: #181818; display: flex; gap: 10px; border-bottom: 1px solid #282828; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #242424; color: #fff; font-size: 15px; outline: none; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #1db954; color: #fff; font-weight: bold; cursor: pointer; }
    #list { flex: 1; overflow-y: auto; padding: 10px; list-style: none; margin: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid #1f1f1f; }
    img { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; background: #222; }
    .info { flex: 1; overflow: hidden; }
    .title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: 13px; color: #b3b3b3; margin-top: 3px; }
    #player { padding: 15px; background: #181818; border-top: 1px solid #282828; display: flex; flex-direction: column; gap: 10px; }
    audio { width: 100%; height: 40px; }
  </style>
</head>
<body>
  <header>
    <input type="text" id="query" placeholder="Search songs or artists..." onkeydown="if(event.key==='Enter') search()">
    <button onclick="search()">Search</button>
  </header>
  <ul id="list"></ul>
  <div id="player">
    <div id="nowPlaying" style="font-size: 14px; font-weight: 600; color: #1db954;">No track playing</div>
    <audio id="audio" controls autoplay></audio>
  </div>

  <script>
    // Browser CORS Bypass via Dynamic Script Tag (JSONP)
    function search() {
      const q = document.getElementById('query').value.trim();
      if (!q) return;
      const list = document.getElementById('list');
      list.innerHTML = "<p style='text-align:center; color:#888;'>Searching songs...</p>";

      // Clean old script tag if exists
      const oldScript = document.getElementById('jsonp-search');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-search';
      script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=30&callback=handleResults`;
      document.body.appendChild(script);
    }

    window.handleResults = function(data) {
      const list = document.getElementById('list');
      list.innerHTML = "";

      if (!data.results || data.results.length === 0) {
        list.innerHTML = "<p style='text-align:center; color:#888;'>No songs found.</p>";
        return;
      }

      data.results.forEach(item => {
        const title = item.trackName || 'Unknown Title';
        const artist = item.artistName || 'Unknown Artist';
        const thumb = item.artworkUrl100 || 'https://placeholder.com';
        const previewUrl = item.previewUrl;

        const li = document.createElement('li');
        li.innerHTML = `
          <img src="${thumb}" alt="art">
          <div class="info">
            <div class="title">${title}</div>
            <div class="sub">${artist}</div>
          </div>
          <button onclick="playSong('${previewUrl}', '${title.replace(/'/g, "\\'")}')">Play</button>
        `;
        list.appendChild(li);
      });
    };

    function playSong(url, title) {
      document.getElementById('nowPlaying').innerText = "Playing: " + title;
      const audio = document.getElementById('audio');
      audio.src = url;
      audio.play();
    }
  </script>
</body>
</html>
