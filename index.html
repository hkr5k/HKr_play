<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musify Web Player</title>
  <meta name="theme-color" content="#121212">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 15px; background: #181818; display: flex; gap: 10px; border-bottom: 1px solid #282828; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #242424; color: #fff; font-size: 15px; outline: none; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #1db954; color: #fff; font-weight: bold; cursor: pointer; }
    #list { flex: 1; overflow-y: auto; padding: 10px; list-style: none; margin: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid #1f1f1f; }
    img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: #222; }
    .info { flex: 1; overflow: hidden; }
    .title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: 13px; color: #b3b3b3; margin-top: 3px; }
    #player { padding: 15px; background: #181818; border-top: 1px solid #282828; display: flex; flex-direction: column; gap: 10px; }
    audio { width: 100%; height: 40px; }
  </style>
</head>
<body>
  <header>
    <input type="text" id="query" placeholder="Search songs or artists..." onkeydown="if(event.key==='Enter') search()">
    <button onclick="search()">Search</button>
  </header>
  <ul id="list"></ul>
  <div id="player">
    <div id="nowPlaying" style="font-size: 14px; font-weight: 600; color: #1db954;">No track playing</div>
    <audio id="audio" controls autoplay></audio>
  </div>

  <script>
    const serverUrl = "https://railway.app";

    async function search() {
      const q = document.getElementById('query').value.trim();
      if (!q) return;
      const list = document.getElementById('list');
      list.innerHTML = "<p style='text-align:center; color:#888;'>Searching songs...</p>";

      try {
        // Direct call without sluggish external proxies
        let res = await fetch(`${serverUrl}/search/?query=${encodeURIComponent(q)}&filter=songs`);
        if (!res.ok) {
          throw new Error("HTTP error " + res.status);
        }
        let data = await res.json();

        list.innerHTML = "";
        if (!Array.isArray(data) || data.length === 0) {
          list.innerHTML = "<p style='text-align:center; color:#888;'>No results found.</p>";
          return;
        }

        data.forEach(item => {
          const title = item.title || 'Unknown Title';
          let artist = 'Unknown Artist';
          if (Array.isArray(item.artists)) {
            artist = item.artists.map(a => typeof a === 'object' ? a.name : a).join(', ');
          } else if (typeof item.artists === 'string') {
            artist = item.artists;
          }

          let thumb = 'https://placeholder.com';
          if (Array.isArray(item.thumbnails) && item.thumbnails.length > 0) {
            thumb = item.thumbnails[item.thumbnails.length - 1].url || thumb;
          }

          const videoId = item.videoId;

          const li = document.createElement('li');
          li.innerHTML = `
            <img src="${thumb}" alt="art">
            <div class="info">
              <div class="title">${title}</div>
              <div class="sub">${artist}</div>
            </div>
            <button onclick="playSong('${videoId}', '${title.replace(/'/g, "\\'")}')">Play</button>
          `;
          list.appendChild(li);
        });
      } catch (err) {
        list.innerHTML = "<p style='color:#e91e63; text-align:center;'>Search failed. Please ensure Railway server is awake and try again.</p>";
      }
    }

    function playSong(id, title) {
      document.getElementById('nowPlaying').innerText = "Playing: " + title;
      const audio = document.getElementById('audio');
      // Direct stream link via reliable public instance
      audio.src = `https://kavin.rocks{id}`;
      audio.play().catch(() => {
        // Fallback stream
        audio.src = `https://privacydev.net{id}`;
        audio.play();
      });
    }
  </script>
</body>
</html>
